<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="28%" r="70%">
      <stop offset="0" stop-color="#3b0a14"/>
      <stop offset="0.55" stop-color="#0d0f17"/>
      <stop offset="1" stop-color="#06070a"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#10B981"/>
      <stop offset="0.6" stop-color="#F59E0B"/>
      <stop offset="0.8" stop-color="#E01E2E"/>
      <stop offset="1" stop-color="#E01E2E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Seismic rings -->
  <g transform="translate(930 190)" fill="none" stroke="#E01E2E">
    <circle r="40" stroke-opacity="0.9" stroke-width="3"/>
    <circle r="95" stroke-opacity="0.45" stroke-width="2"/>
    <circle r="165" stroke-opacity="0.22" stroke-width="2"/>
    <circle r="250" stroke-opacity="0.1" stroke-width="2"/>
    <circle r="12" fill="#E01E2E" stroke="none"/>
  </g>

  <!-- Seismograph trace -->
  <polyline fill="none" stroke="url(#wave)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    points="0,470 120,470 160,468 190,474 220,462 250,478 280,470 330,470 360,440 380,505 400,410 425,540 450,380 478,560 505,420 530,500 555,455 580,482 610,466 650,472 700,470 760,469 820,471 900,470 1200,470"/>

  <!-- Brand -->
  <g font-family="'Segoe UI', 'Outfit', 'Inter', Arial, sans-serif">
    <text x="80" y="170" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">afet<tspan fill="#E01E2E">.</tspan>live</text>
    <text x="84" y="232" font-size="36" font-weight="600" fill="#e5e7eb">Türkiye 3D Afet &amp; Deprem Erken Uyarı Atlası</text>
    <text x="84" y="282" font-size="25" font-weight="400" fill="#9ca3af">27.331 AFAD toplanma alanı · 1.740 sağlık tesisi · Çevrimdışı çalışır</text>

    <g font-size="22" font-weight="600">
      <rect x="84" y="548" width="256" height="46" rx="23" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="212" y="578" text-anchor="middle" fill="#6ee7b7">Gece Sismograf Nöbeti</text>
      <rect x="356" y="548" width="196" height="46" rx="23" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.4"/>
      <text x="454" y="578" text-anchor="middle" fill="#fcd34d">Bina Risk Kartı</text>
      <rect x="568" y="548" width="206" height="46" rx="23" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="671" y="578" text-anchor="middle" fill="#a5f3fc">QR Güvendeyim</text>
      <rect x="790" y="548" width="182" height="46" rx="23" fill="#E01E2E" fill-opacity="0.16" stroke="#E01E2E" stroke-opacity="0.5"/>
      <text x="881" y="578" text-anchor="middle" fill="#fda4af">Afet Düdüğü</text>
    </g>
  </g>
</svg>
