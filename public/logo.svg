  <text x="500" y="800" text-anchor="middle" font-family="'Outfit', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="140" letter-spacing="-3px">
    <tspan fill="#0C1728">afet.</tspan><tspan fill="#E01E2E">live</tspan>
