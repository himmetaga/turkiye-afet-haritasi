  <!-- 4 Square Window Panes -->
  <rect x="487" y="498" width="18" height="18" rx="2.5" fill="#0C1728" />
  <rect x="509" y="498" width="18" height="18" rx="2.5" fill="#0C1728" />
  <rect x="487" y="520" width="18" height="18" rx="2.5" fill="#0C1728" />
  <rect x="509" y="520" width="18" height="18" rx="2.5" fill="#0C1728" />

