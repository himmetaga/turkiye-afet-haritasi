<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" fill="none">
  <!-- Outer Pin Upper Arc & Teardrop Body -->
  <!-- Top arc from left tangent (369.2, 497.8) to right tangent (630.8, 497.8) with R=190 -->
  <path d="M 369.2 497.8
           A 190 190 0 1 1 630.8 497.8
           L 500 636
           Z"
        fill="#E01E2E" />

  <!-- Inner Circle Cutout (Center 500, 360, R=135) -->
  <circle cx="500" cy="360" r="135" fill="#FFFFFF" />

  <!-- Symmetrical Seismic Waveform (Centered along Y=360) -->
  <path d="M 345 360
           L 422 360
           L 444 282
           L 466 414
           L 492 224
           L 520 410
           L 546 294
           L 568 372
           L 582 360
           L 655 360"
        stroke="#E01E2E"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- House Gable Roof with Right Chimney -->
  <!-- Chimney on right roof slope -->
  <path d="M 554 456 L 554 430 L 582 430 L 582 480 Z" fill="#0C1728" />

  <!-- Gable Roof Slab (Apex at 500, 434) -->
  <path d="M 500 434
           L 628 534
           L 610 556
           L 500 470
           L 390 556
           L 372 534
           Z"
        fill="#0C1728" />

  <!-- Interior House White Area Under Roof -->
  <path d="M 500 475
           L 606 558
           L 500 626
           L 394 558
           Z"
        fill="#FFFFFF" />

  <!-- 4 Square Window Panes (2x2 Matrix) -->
  <rect x="487" y="498" width="18" height="18" rx="2.5" fill="#0C1728" />
  <rect x="509" y="498" width="18" height="18" rx="2.5" fill="#0C1728" />
  <rect x="487" y="520" width="18" height="18" rx="2.5" fill="#0C1728" />
  <rect x="509" y="520" width="18" height="18" rx="2.5" fill="#0C1728" />

  <!-- Red V-Chevron Below Windows (Parallel to Pin Tip) -->
  <path d="M 404 556
           L 500 618
           L 596 556
           L 606 568
           L 500 636
           L 394 568
           Z"
        fill="#E01E2E" />
</svg>